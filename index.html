<!--
FREE SETUP (Firebase Spark plan, no Storage needed):
1. Firebase console > Authentication > enable Email/Password. Add ONE user = your admin email + password.
2. Firestore Database > create (production mode) > Rules tab > paste the rules below (replace ADMIN_EMAIL).
3. Project settings > Your apps > Web app > copy config into firebaseConfig below. Set ADMIN_EMAIL below too.
4. Upload this file as index.html to a GitHub repo, enable Pages, paste the Pages link into WebIntoApp.
6. Teachers: Admin > Teachers > create ID + password, then tap Verify. Teachers log in with 'Teacher login'.
5. PDFs/photos/Word files: upload directly from Admin > Content (max 10 MB each) or paste a link. Publish the rules below in Firestore > Rules.

rules_version='2';service cloud.firestore{match /databases/{d}/documents{
 function signed(){return request.auth!=null}
 function admin(){return request.auth!=null&&request.auth.token.email=="parthadasofficialuse@gmail.com"}
 function tdoc(){return get(/databases/$(d)/documents/teachers/$(request.auth.uid)).data}
 function teacher(){return signed()&&request.auth.token.email.matches(".*@teacher[.]pdl")&&exists(/databases/$(d)/documents/teachers/$(request.auth.uid))&&tdoc().verified==true&&tdoc().status=="active"}
 function mine(){return teacher()&&resource.data.by==tdoc().tid}
 function cardOf(t){return get(/databases/$(d)/documents/teacherIds/$(t)).data}
 function ok(){return admin()||teacher()||(signed()&&get(/databases/$(d)/documents/users/$(request.auth.uid)).data.verified==true)}
 match /users/{u}{allow read,delete:if admin()||request.auth.uid==u;
  allow create:if request.auth.uid==u&&request.resource.data.verified==false&&request.resource.data.status=="active"&&request.resource.data.keys().hasOnly(["name","phone","cls","school","district","dob","status","verified","created"]);
  allow update:if admin()||(request.auth.uid==u&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(["online","lastSeen","photo","cls"]))}
 match /teachers/{u}{allow read:if admin()||request.auth.uid==u;
  allow delete:if admin();
  allow create:if admin()||(request.auth.uid==u&&request.auth.token.email.matches(".*@teacher[.]pdl")&&request.resource.data.keys().hasOnly(["name","tid","status","verified","created","pw"])&&request.resource.data.status=="active"&&request.resource.data.pw is string&&request.resource.data.tid is string&&request.resource.data.name==cardOf(request.resource.data.tid).name&&request.resource.data.verified==true&&cardOf(request.resource.data.tid).open==true&&getAfter(/databases/$(d)/documents/teacherIds/$(request.resource.data.tid)).data.uid==u);
  allow update:if admin()||(request.auth.uid==u&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(["online","lastSeen","photo","pw"]))}
 match /teacherIds/{t}{allow read,write:if admin();
  allow get:if signed()&&resource.data.open==true;
  allow update:if signed()&&resource.data.open==true&&request.resource.data.open==false&&request.resource.data.uid==request.auth.uid&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(["open","uid"])}
 match /tgen/{t}{allow get:if true;allow write:if admin()}
 match /stats/{s}{allow read:if admin()||teacher();allow write:if admin()}
 match /shared/{id}{allow read:if admin()||teacher();allow write:if admin();
  allow update:if teacher()&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(["rby","rtxt","rts"])}
 match /sharedUsers/{u}{allow read:if admin()||teacher();allow write:if admin()}
 match /blocked/{b}{allow get:if signed();allow list,write:if admin()}
 match /content/{c}{allow read:if ok();allow write:if admin();
  allow create:if teacher()&&request.resource.data.by==tdoc().tid&&request.resource.data.pending==true&&request.resource.data.hidden==true;
  allow update:if mine()&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(["canView","canDownload"]);
  allow delete:if mine()}
 match /notices/{c}{allow read:if ok();allow write:if admin()}
 match /ads/{c}{allow read:if true;allow write:if admin()}
 match /settings/{s}{allow read:if true;allow write:if admin()}
 match /pubfiles/{f}{allow read,write:if admin()}
 match /files/{f}/parts/{p}{allow read:if admin()||teacher()||(ok()&&exists(/databases/$(d)/documents/pubfiles/$(f)));allow write:if admin();
  allow create:if teacher()&&request.resource.data.by==tdoc().tid;
  allow update:if mine()&&request.resource.data.by==resource.data.by;
  allow delete:if mine()}
 match /adfiles/{f}/parts/{p}{allow read:if true;allow write:if admin()}
 match /chats/{u}{allow read,write:if admin()||request.auth.uid==u;
  allow update:if teacher()&&exists(/databases/$(d)/documents/sharedUsers/$(u))&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(["adminTs","adminUnread"]);
  match /msgs/{m}{allow read,write:if admin()||request.auth.uid==u;
   allow create:if teacher()&&exists(/databases/$(d)/documents/sharedUsers/$(u))&&request.resource.data.from=="a"}}
 match /polls/{c}{allow read:if ok();allow write:if admin();allow create:if teacher()&&request.resource.data.by==tdoc().tid&&request.resource.data.pending==true&&request.resource.data.hidden==true;allow delete:if mine()}
 match /votes/{v}{allow read:if ok();allow create:if ok()&&v==request.resource.data.pollId+"_"+request.auth.uid&&request.resource.data.uid==request.auth.uid;allow delete:if admin()}
}}

<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}body{overscroll-behavior:none}
:root{--ink:#1b2250;--pri:#27337f;--acc:#f2a33a;--bg:#f5f6fb;--ok:#14a39a;--bad:#d64545;--mut:#6b7392}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Noto Sans","Noto Sans Bengali",sans-serif;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px}
header b{flex:1;font-size:18px}header button{background:none;border:0;color:#fff;font-size:20px}
main{padding:14px;max-width:640px;margin:auto}
button{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--pri);color:#fff;margin:2px}
button.alt{background:var(--acc);color:var(--ink)}button.bad{background:var(--bad)}button.wide{width:100%;padding:12px}
.in,select{width:100%;padding:11px;border:1.5px solid #cfd3e6;border-radius:10px;font:inherit;margin:4px 0;background:#fff}
.mut,small{color:var(--mut);display:block}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.who{display:flex;gap:10px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--acc);display:grid;place-items:center;font-weight:700;font-size:20px}
.bell{position:relative;background:#fff;color:var(--ink);font-size:20px}
.bell i,nav i{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.ad{margin:12px 0;border-radius:14px;overflow:hidden;background:var(--ink);color:#fff;min-height:70px}
.ad img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.ad p{margin:0;padding:14px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{background:#fff;color:var(--ink);padding:18px 8px;font-weight:700;border:2px solid var(--pri);border-radius:14px}
.sub span{display:block;font-size:28px}
.item,.box{background:#fff;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.box{display:block}.item b,.item small{display:block}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}.dot.on{background:#2563eb}.dot.off{background:#f2c200}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #dde0ee;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--ink);font-size:11px;position:relative;border-radius:0}nav button span{display:block;font-size:20px}
.msgs{height:60vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;background:#fff;padding:8px 12px;border-radius:12px;align-self:flex-start}.m.mine{background:var(--acc);align-self:flex-end}.m img{max-width:100%;border-radius:8px;display:block}
.send{display:flex;gap:4px;align-items:center}.clip{font-size:24px}
.pdf{width:100%;height:80vh;border:0}.full{width:100%}
.tabs{display:flex;gap:4px;overflow:auto}.tabs button{background:#fff;color:var(--ink)}.tabs .on{background:var(--acc)}
.auth{max-width:420px;margin:auto;padding:24px 18px}.auth h1{margin:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:9}#toast.show{opacity:1}
.opt{display:block;padding:8px 4px}.bar{position:relative;background:#e6e9f5;border-radius:10px;margin:6px 0;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--acc);opacity:.6}.bar span{position:relative;display:block;padding:9px 12px}body{background:linear-gradient(#eceeff,#fff3e3 60%,#e6fbf3) fixed}
header{background:linear-gradient(135deg,#27337f,#7b3fe4 60%,#e0527a)}
button{background:linear-gradient(135deg,#27337f,#4f6df5)}
button.alt{background:linear-gradient(135deg,#f2a33a,#f7c948)}
button.bad{background:linear-gradient(135deg,#d64545,#f0716f)}
.sub{color:#fff;border:0;box-shadow:0 5px 12px rgba(0,0,0,.18);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.hero{background:linear-gradient(135deg,#7b3fe4,#e0527a);color:#fff;border-radius:16px;padding:12px}
.hero small{color:#ffe3ee}.hero .av{background:#fff;color:#7b3fe4}
.item,.box{border-left:5px solid #7b3fe4;box-shadow:0 2px 8px rgba(40,50,120,.08)}
.item:nth-child(3n+2){border-left-color:#f2a33a}.item:nth-child(3n){border-left-color:#14a39a}
.tabs .on{background:linear-gradient(135deg,#f2a33a,#f7c948)}
.m.mine{background:linear-gradient(135deg,#f7c948,#f2a33a)}
.auth h1{background:linear-gradient(90deg,#27337f,#e0527a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
nav{box-shadow:0 -3px 12px rgba(0,0,0,.08)}
.authwrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,#27337f,#7b3fe4 55%,#e0527a);position:relative;overflow:hidden}
.authwrap:before,.authwrap:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.authwrap:before{width:260px;height:260px;top:-80px;right:-80px}.authwrap:after{width:200px;height:200px;bottom:-60px;left:-60px}
.card{position:relative;z-index:1;background:#fff;border-radius:26px;padding:26px 22px;max-width:420px;width:100%;margin:50px auto 0;box-shadow:0 20px 50px rgba(20,10,80,.35)}
.logo{width:78px;height:78px;border-radius:50%;margin:-64px auto 10px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#f2a33a,#f7c948);border:5px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.card h1{text-align:center;margin:0;font-size:27px;background:linear-gradient(90deg,#27337f,#e0527a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub2{text-align:center;color:var(--mut);margin:6px 0 14px}.sub2 b{color:var(--ink);font-size:18px}
.fld{display:flex;align-items:center;gap:8px;background:#f1f3fb;border:2px solid transparent;border-radius:14px;padding:0 12px;margin:10px 0}
.fld:focus-within{border-color:#7b3fe4;background:#fff}
.fld input,.fld select{flex:1;border:0;background:none;padding:13px 0;font:inherit;outline:0;min-width:0;color:var(--ink)}

.authwrap{justify-content:flex-start;padding:22px 16px 18px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 860' preserveAspectRatio='xMidYMid slice'><g fill='none' stroke='%232f7bff' stroke-opacity='.55' stroke-width='2'><path d='M-10 120 60 88 125 118 60 150z'/><path d='M22 138v28q38 22 76 0v-28'/></g><g fill='%232f7bff' fill-opacity='.35'><path d='M305 62l22 22-22 22-22-22z'/><path d='M14 360l12 12-12 12-12-12z' fill-opacity='.8'/><path d='M12 505l16 16-16 16-16-16z' fill-opacity='.25'/></g><path d='M388 292l22 22-22 22-22-22z' fill='none' stroke='%232f7bff' stroke-width='2.5'/><g fill='%232f7bff' fill-opacity='.55'><g id='d'><circle cx='350' cy='76' r='1.6'/><circle cx='364' cy='76' r='1.6'/><circle cx='378' cy='76' r='1.6'/><circle cx='350' cy='90' r='1.6'/><circle cx='364' cy='90' r='1.6'/><circle cx='378' cy='90' r='1.6'/><circle cx='350' cy='104' r='1.6'/><circle cx='364' cy='104' r='1.6'/><circle cx='378' cy='104' r='1.6'/></g><use href='%23d' x='-340' y='160'/><use href='%23d' x='10' y='430'/><use href='%23d' x='-300' y='600'/></g><g stroke='%232f7bff' stroke-opacity='.4' stroke-width='1.5' fill='%23123fae' fill-opacity='.6'><rect x='-20' y='770' width='110' height='24' rx='4' transform='rotate(-8 -20 770)'/><rect x='-20' y='800' width='120' height='26' rx='4' transform='rotate(-6 -20 800)'/><rect x='-20' y='832' width='130' height='28' rx='4'/></g><path d='M338 842l30-14 36 12v-28l-36-12-30 14z' fill='none' stroke='%232f7bff' stroke-opacity='.55' stroke-width='2'/></svg>") center/cover no-repeat,radial-gradient(circle at 78% 4%,rgba(60,140,255,.55),transparent 36%),linear-gradient(165deg,#031a5c,#0a3bb5 45%,#041a63 100%)}
.authwrap:before,.authwrap:after{display:none}
.ahead{display:flex;justify-content:space-between;align-items:flex-start;margin:6px 4px 18px;position:relative;z-index:1}
.ahead b{display:block;color:#fff;font-size:32px;font-weight:900;letter-spacing:.5px;line-height:1.05}
.ahead small{display:block;color:#7fc4ff;font-size:12.5px;letter-spacing:3px;font-weight:600;margin-top:8px}.ahead small i{font-style:normal;margin:0 5px}
.ahead img{width:46px;height:46px;border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.card{margin-top:0;border-radius:34px;padding:24px 22px 22px;background:#fff;border:0;box-shadow:0 26px 60px rgba(0,10,60,.55);position:relative;z-index:1}
.logoimg{width:96px;height:96px;border-radius:24px;margin:0 auto 6px;border:0;filter:none;box-shadow:0 10px 22px rgba(255,70,40,.3)}
.sub2{font-size:16px;color:#4a63a8;margin:2px 0 12px}
.sub2 b{font-size:31px;font-weight:900;background:none;-webkit-text-fill-color:#0a1f78;color:#0a1f78;letter-spacing:-.3px;line-height:1.2}
.sub2 br{display:none}
.fld{background:#f3f7ff;border:1.5px solid #c9d9f7;border-radius:30px;padding:0 16px 0 0;margin:12px 0;box-shadow:none;gap:0}
.fld>span{display:grid;place-items:center;width:54px;height:30px;border-right:1.5px solid #c9d9f7;margin-right:14px;flex:none}
.fld input,.fld select{color:#0a1f78;font-size:16px;padding:14px 0}
.fld input::placeholder{color:#5b72b0}
.fld:focus-within{border-color:#0b5fff;box-shadow:0 0 0 4px rgba(11,95,255,.14)}
.rem{color:#0a1f78;font-size:15px;margin:10px 4px 12px;display:flex;align-items:center;gap:10px}
.rem input{width:22px;height:22px;accent-color:#0b5fff}
.go{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:30px;padding:15px;font-size:20px;font-weight:700;background:linear-gradient(90deg,#0aa3ff,#0b4fe0);box-shadow:0 12px 24px rgba(11,95,255,.4)}
.or{display:flex;align-items:center;gap:12px;color:#5b72b0;font-size:15px;margin:18px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:#d3def5}
.ghost{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:2px solid #0b5fff;border-radius:30px;color:#0b5fff;font-size:17px;font-weight:700;padding:12px;margin:10px 0}
.notice{display:flex;align-items:center;gap:12px;background:#fff7dd;border:1.5px solid #f4d36a;border-radius:16px;color:#1c2a5a;font-size:13px;line-height:1.4;padding:12px 14px;margin-top:16px}
.notice::before{content:"!";flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#ffb81c;color:#fff;font-weight:900;font-size:22px;margin-right:2px}
.foot{position:relative;z-index:1;display:table;margin:16px auto 0}

/* profile + multi upload */
.mf{background:#f3f7ff;border:1.5px solid #d5e1fa;border-radius:14px;padding:8px 10px;margin:8px 0}.mf small{color:#0b5fff;font-weight:600;word-break:break-all}.mf .in{margin:6px 0 0}
.pcard{position:relative;text-align:center;background:#fff;border-radius:24px;padding:0 16px 18px;margin-bottom:14px;box-shadow:0 8px 22px rgba(11,95,255,.12);overflow:hidden}
.pbg{height:84px;margin:0 -16px;background:linear-gradient(135deg,#0b5fff,#2d8bff 60%,#22d3c5)}
.pcard .av{display:grid;place-items:center;width:100px;height:100px;border-radius:50%;margin:-50px auto 6px;border:4px solid #fff;box-shadow:0 6px 16px rgba(11,95,255,.3);font-size:42px;object-fit:cover;background:#e3eeff;color:#0b5fff;position:relative}
.pcam{display:inline-block;background:#e8f1ff;color:#0b5fff;font-weight:700;font-size:13px;border-radius:20px;padding:6px 14px;cursor:pointer}
.pname{justify-content:center;margin:10px 0 6px;font-size:22px;color:#0a1f78}.pname::before{display:none}
.pbadge{display:inline-block;background:linear-gradient(135deg,#0b5fff,#2d8bff);color:#fff;font-weight:700;font-size:13px;border-radius:20px;padding:5px 16px}
.pdet{padding:6px 14px}
.pr{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #eaf0fc}.pr:last-child{border-bottom:0}
.pr>span{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#e8f1ff;font-size:19px;flex:none}
.pr small{display:block;color:#6a7896;font-size:12px}.pr b{display:block;color:#0b5fff;font-size:16px;font-weight:700;word-break:break-word}

/* subject tiles (pastel) */
.sub{background:color-mix(in srgb,var(--a) 14%,#fff);background-color:#eef3ff;color:#0a1f78;text-align:left;min-height:150px;padding:12px 14px 14px;border:1px solid color-mix(in srgb,var(--a) 22%,#fff);box-shadow:0 4px 12px rgba(15,31,75,.06);font-size:18px;font-weight:800;letter-spacing:0;text-transform:none}
.sub::before{display:none}
.sub span{display:block;width:auto;height:auto;background:none;box-shadow:none;border-radius:0;font-size:52px;line-height:1;text-align:center;margin:0 0 8px}
.sub small{color:#2a3f86;font-size:14px;font-weight:500;padding-right:40px;margin-top:4px}
.sub::after{content:"›";background:var(--a);color:#fff;right:12px;bottom:12px;width:36px;height:36px;font-size:26px;box-shadow:0 4px 10px color-mix(in srgb,var(--a) 45%,transparent)}
.sub .cb{background:var(--a);color:#fff}
/* poll cards */
.pc,.pc2{background:#fff}
.pc{border:1px solid #e3ebfa;border-radius:20px;padding:12px;box-shadow:0 4px 14px rgba(11,95,255,.07)}
.pch{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.pic{width:48px;height:48px;border-radius:50%;background:#e3eeff;display:grid;place-items:center;font-size:24px;flex:none}.pic.m{background:#ffe6ee}
.chip{display:inline-block;background:#e3eeff;color:#0b5fff;font-weight:700;font-size:13px;border-radius:20px;padding:4px 14px}.chip.m{background:#ffe6ee;color:#e0295a}
.pch .q{display:block;font-size:16.5px;margin-top:6px;color:#0a1f78;line-height:1.35}.inl{display:inline;font-size:12px;color:#6a7896;margin-left:6px}
.rad{display:block;width:20px;height:20px;border-radius:50%;border:2px solid #b9c8ea;background:#fff;flex:none}
.po{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid #e3ebfa;border-radius:14px;margin:7px 0;font-weight:600;color:#0a1f78;cursor:pointer}
.po.on{border-color:#0b5fff;background:#eef4ff}.po.on .rad{border-color:#0b5fff;background:#0b5fff;box-shadow:inset 0 0 0 4px #fff}
.po.ok{border-color:#1fa971;background:#e6f8ee}.po.ok .rad{border-color:#1fa971;background:#1fa971;box-shadow:inset 0 0 0 4px #fff}
.po.no{border-color:#e05252;background:#fdeaea}.po.no .rad{border-color:#e05252}
.vote{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;border-radius:30px;padding:12px;margin-top:8px;font-size:16px;font-weight:700}
.box.pc2{border-left:0;border:1px solid #e3ebfa;border-radius:22px;padding:14px}
.ao{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px;color:#0a1f78}
.ao .ol{flex:0 0 30%;min-width:70px;word-break:break-word}
.trk{flex:1;height:10px;border-radius:6px;background:#e9eef9;overflow:hidden}.trk i{display:block;height:100%;border-radius:6px}
.ao em{font-style:normal;flex:0 0 62px;text-align:right;font-weight:600;color:#3d5a94;font-size:12.5px}
.vc{color:#51629a;font-weight:600;font-size:14px;margin:6px 0 4px}

/* ===== file viewer v2 ===== */
.vw2{position:fixed;left:0;right:0;bottom:0;top:64px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;background:#e3e8f5;z-index:1}
#zt{position:relative}#zt img{width:100%;display:block}
.pgw{position:relative;width:100%;height:0;background:#fff;margin:0 0 8px;box-shadow:0 2px 8px rgba(0,0,0,.18)}.pgw canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.zb2{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:6px;background:#fff;border-radius:30px;padding:6px 10px;box-shadow:0 6px 20px rgba(10,30,90,.35);white-space:nowrap}
.zb2 button{margin:0;padding:8px 14px;font-size:18px;border-radius:22px}.zb2 span{min-width:52px;text-align:center;font-weight:700;color:#0a1f78}
.pgi{position:fixed;right:12px;top:76px;z-index:6;background:rgba(15,31,75,.82);color:#fff;border-radius:16px;padding:4px 12px;font-size:13px;font-weight:700}
.doc{background:#fff;padding:16px;font:16px/1.6 system-ui,"Noto Sans",sans-serif;word-break:break-word;min-height:100%}.doc img{max-width:100%;height:auto}.doc table{border-collapse:collapse;display:block;overflow-x:auto}.doc td,.doc th{border:1px solid #ccd3e8;padding:4px 8px}

/* ===== v3: document-scroll viewer, problem banner, clock, upload bars ===== */
.vw3{margin:-16px -14px;background:#e3e8f5;min-height:75vh;overflow-x:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.pgw::before{content:attr(data-n);position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#9aa3c7;font-weight:700;font-size:15px}
#prob{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:60;display:none;background:#b3261e;color:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:14px;line-height:1.45}
#prob.on{display:flex;gap:10px;align-items:flex-start}#prob.warn{background:#8a5a00}
#prob div{flex:1}#prob small{color:#ffd9d6;margin-top:3px;word-break:break-word}#prob button{background:rgba(255,255,255,.22);padding:4px 10px;margin:0;flex:none}
.clkbar{display:flex;justify-content:center;align-items:center;background:#fff;border:1px solid #dfe5f6;border-radius:14px;padding:8px 12px;margin:0 0 12px;font-weight:700;color:#27337f;font-size:14px;box-shadow:0 2px 8px rgba(40,50,120,.07);text-align:center}
.mf{margin:6px 0}.upb{height:8px;border-radius:5px;background:#e9eef9;overflow:hidden;margin-top:2px}.upb i{display:block;height:100%;width:0;background:#0b5fff;transition:width .2s}
.mf.ok .upb i{background:#16a34a}.mf.err .upb i{background:#d64545;width:100%!important}
.c810{display:block;font-style:normal;font-size:11px;font-weight:800;background:rgba(255,255,255,.28);border-radius:8px;padding:1px 8px;margin:2px 0 4px;width:fit-content}

/* ===== v4 layout polish ===== */
nav{justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 2px;font-size:11.5px;line-height:1.2;white-space:nowrap}
nav button span{margin:0;line-height:1}
.grid{gap:12px}
.sub{display:flex;flex-direction:column;justify-content:flex-start;min-height:132px;padding:14px}
.sub[onclick="go('job')"]{min-height:104px}
.sub small{padding-right:0}
.agrid{gap:12px}
.acard{display:flex;flex-direction:column;min-height:132px}
.acard small{margin-top:3px;line-height:1.35}
.stats{gap:12px}
.hero{margin-bottom:10px}

/* ===== v5 additions ===== */
#toast{z-index:99}
.zb2{gap:4px;max-width:calc(100vw - 12px)}.zb2 button{padding:8px 11px}
.rw{width:100%}
.mfh{display:flex;justify-content:space-between;align-items:center;gap:6px}.mfh small{flex:1;min-width:0}.mfh .mini{padding:2px 10px;margin:0}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#25d366,#128c4a);color:#fff!important;text-decoration:none;font-weight:800;font-size:17px;border-radius:30px;padding:13px 16px;box-shadow:0 8px 18px rgba(18,140,74,.35)}
.wa svg{border:2px solid #fff;border-radius:50%;flex:none}
.walink{display:block;word-break:break-all;color:#0b5fff;font-size:13px;margin:12px 0 6px;text-decoration:underline}
nav button.ct{color:#128c4a;font-weight:700}nav button.ct span{filter:none;opacity:1}
header .rf{background:rgba(255,255,255,.18)!important;border-radius:12px;width:40px;height:40px;padding:0;font-size:18px;flex:none}
.authwrap .paybx{position:relative;z-index:1;max-width:420px;width:100%;margin:16px auto 0}
/* ===== v6 additions ===== */
.sc{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px 10px 8px;margin:0;min-width:0;border:0;border-radius:22px;text-align:left;color:#fff;background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 8px 16px rgba(15,31,75,.24),inset 0 2px 0 rgba(255,255,255,.38);overflow:hidden}
.sc::before{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.13)}
.sc::after{content:"";position:absolute;left:-46px;bottom:34px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08)}
.sc:active{transform:scale(.97)}
.sct{position:relative;z-index:1;display:flex;align-items:center;gap:6px}
.sclg{width:22px;height:22px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.sct span{font-size:11px;font-weight:800;line-height:1.1}
.sct small{display:block;font-size:7.5px;font-weight:600;opacity:.9;color:#fff;padding:0}
.scn{margin-left:auto;font-style:normal;font-size:9.5px;font-weight:800;background:rgba(255,255,255,.24);border-radius:10px;padding:2px 7px;white-space:nowrap}
.sca{position:relative;z-index:1;height:92px;display:flex;align-items:center;justify-content:center}
.sca svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.22))}
.scw .sca{height:130px}
.scp{position:relative;z-index:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:6px 8px;box-shadow:0 4px 8px rgba(0,0,0,.2)}
.scp i{width:26px;height:26px;border-radius:8px;background:var(--tc);display:grid;place-items:center;font-style:normal;font-size:14px;flex:none}
.scp b{color:var(--tc);font-size:16px;font-weight:900;line-height:1;letter-spacing:0}
.sctg{position:relative;z-index:1;text-align:center;font-size:10.5px;font-weight:600;opacity:.95}
.sc .cb{top:34px;right:8px;z-index:3}
.qrw{text-align:center;margin:18px auto 6px}
.upi2{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#244a99;background:#fff;border-radius:10px;padding:3px 10px}
.qr{max-width:170px}
.vmb{position:relative;display:flex;gap:10px;align-items:flex-start;margin:10px 12px 0;padding:11px 13px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#ff416c,#ff4b2b 55%,#ff9a3c);box-shadow:0 0 0 2px rgba(255,255,255,.92),0 8px 20px rgba(255,65,108,.45);overflow:hidden}
.vmb::after{content:"";position:absolute;top:0;left:0;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:translateX(-120%);animation:vms 3.4s ease-in-out infinite}
@keyframes vms{to{transform:translateX(420%)}}
.vmi{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;transform-origin:50% 60%;animation:vmw 1.8s ease-in-out infinite}
@keyframes vmw{0%,60%,100%{transform:rotate(0)}15%{transform:rotate(-16deg)}30%{transform:rotate(14deg)}45%{transform:rotate(-8deg)}}
.vmt{position:relative;z-index:1;flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.45;white-space:pre-wrap;word-break:break-word;letter-spacing:normal;word-spacing:normal;color:#fff;-webkit-text-fill-color:#fff}
.pw,.notice,.m,.ad p{white-space:pre-wrap;letter-spacing:normal;word-spacing:normal}
header .rf{background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.12))!important;border:1.5px solid rgba(255,255,255,.6);border-radius:14px;width:42px;height:40px;padding:0;margin:0;flex:none;display:grid;place-items:center}
header .rf svg{width:22px;height:22px}
header .rf.spin svg{animation:rfs .5s linear}
@keyframes rfs{to{transform:rotate(360deg)}}
.rotfab{position:fixed;right:12px;bottom:86px;z-index:12;width:60px;height:60px;border-radius:50%;padding:0;margin:0;border:3px solid #fff;background:linear-gradient(135deg,#0b5fff,#0a3fcf);box-shadow:0 8px 18px rgba(10,63,207,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#fff;font-size:9.5px;font-weight:800;line-height:1.1}
.rotfab svg{width:27px;height:27px}
.rotfab[hidden]{display:none}
nav button.lk{opacity:.5}


/* ===== v7 compact + admin cards ===== */
main{padding:10px 12px}
header{padding:9px 12px}
.hero{padding:10px 12px;border-radius:18px;margin-bottom:8px}
.hero .av{width:42px;height:42px;font-size:18px;border-width:2px}
.hero b,.hero.adm b{font-size:17px}
.hero small{font-size:12px}
.bell{width:38px!important;height:38px!important;font-size:18px}
.clkbar{padding:6px 10px;margin:0 0 8px;font-size:13px;border-radius:12px}
.ad{margin:8px 0}
.ad img{aspect-ratio:16/9}
.ad video{max-height:60vh}
h3{font-size:15px;margin:10px 0 6px}
h3::before{height:15px}
.sec{padding:9px 10px;margin:8px 0;border-radius:16px}
.box{padding:10px 12px;margin:6px 0}
button.wide{padding:10px}
.latest{padding:8px 12px;margin:8px 0}
.grid{gap:8px}
.sc{padding:8px 8px 7px;gap:4px;border-radius:18px}
.sct{gap:5px}.sclg{width:20px;height:20px}.sct span{font-size:10.5px}.sct small{font-size:7px}
.sca{height:62px}
.scp{padding:4px 7px;border-radius:13px;gap:6px}.scp i{width:22px;height:22px;font-size:12px;border-radius:7px}.scp b{font-size:14px}
.sctg{font-size:9.5px}
.scw{display:grid;grid-template-columns:46% 1fr;grid-template-rows:auto 1fr auto;column-gap:8px;row-gap:2px}
.scw .sct{grid-column:1/-1}.scw .sca{grid-column:1;grid-row:2/4;height:78px}.scw .scp{grid-column:2;grid-row:2;align-self:end}.scw .sctg{grid-column:2;grid-row:3;align-self:start;text-align:left;padding-left:2px}
.stats{grid-template-columns:repeat(4,1fr);gap:6px}
.stats .st{padding:8px 3px;border-radius:14px}
.stats .si{width:30px;height:30px;font-size:16px;margin:0 auto 3px;border-radius:10px}
.stats .st b{font-size:18px}.stats .st small{font-size:10px}
.agrid{grid-template-columns:repeat(3,1fr);gap:8px}

const AUTO_EN="Sorry for the wait. Your message has been sent to the Admin/Teacher from our side. Please wait for the reply 🙏";
const AUTO_AS="অপেক্ষা কৰা বাবে ক্ষমা কৰিব Admin/ Teacher ক আমাৰ ফালৰ পৰা আপোনাৰ মেছেজটো পঠোৱা হৈছে । উত্তৰ অহালৈ অপেক্ষা কৰক 🙏";
async function autoReply(uid){if(isAdmin||!me)return;const k="pdl_auto_"+uid,now=Date.now();if(now-(+localStorage[k]||0)<1800000)return;localStorage[k]=now;
 const col=db.collection("chats").doc(uid).collection("msgs");
 try{await col.add({from:"a",auto:1,text:AUTO_EN,ts:Date.now()+1});await new Promise(r=>setTimeout(r,1000));await col.add({from:"a",auto:1,text:AUTO_AS,ts:Date.now()+1})}catch(e){}}
function contactUs(){if(unver())return vpop();popup(`<div style="text-align:center;padding:6px 4px"><div style="font-size:40px;line-height:1.2">📞</div><b style="font-size:20px;color:#0a1f78">Contact us</b><p style="font-weight:600;color:#3d5a94;margin:8px 0 14px">আমাৰ WhatsApp গ্ৰুপত Join হওক<br>Join our WhatsApp group</p><a class="wa" href="${esc(WA_GROUP)}" target="_blank" rel="noopener">${WA_ICO}<span>Join WhatsApp Group</span></a><a class="walink" href="${esc(WA_GROUP)}" target="_blank" rel="noopener">${esc(WA_GROUP)}</a><button class="wide ghost" onclick="copyWA()">📋 Copy link</button></div>`)}
function copyWA(){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(WA_GROUP).then(()=>toast("Link copied")).catch(()=>toast("Press and hold the link to copy"));else toast("Press and hold the link to copy")}

const readURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function qrCrop(f){try{const un=URL.createObjectURL(f),im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=un});URL.revokeObjectURL(un);
 const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y+=2)for(let xx=0;xx<w;xx+=2){const i=(y*w+xx)*4;if(d[i]+d[i+1]+d[i+2]<210){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}}
 const bw=x1-x0,bh=y1-y0;if(bw<80||bh<80||Math.abs(bw/bh-1)>.08)return null;
 const side=Math.round(Math.max(bw,bh)*1.1),o=document.createElement("canvas");o.width=o.height=side;const ox=o.getContext("2d");ox.fillStyle="#fff";ox.fillRect(0,0,side,side);ox.drawImage(c,x0,y0,bw,bh,Math.round((side-bw)/2),Math.round((side-bh)/2),bw,bh);
 const out=o.toDataURL("image/png");return out.length<=900000?out:null}catch(e){return null}}
async function qrData(f){const cr=await qrCrop(f);if(cr)return cr;let u=await readURL(f);if(u.length<=900000&&/^data:image\/(png|jpeg|webp)/.test(u))return u;for(const m of [[1600,.95],[1280,.92],[1000,.9]]){u=await shrink(f,m[0],m[1]);if(u.length<=900000)return u}return u}
async function savePay(){const f=$("#pf").files[0],o={upi:$("#pu").value.trim(),name:$("#pn").value.trim(),note:$("#pt").value.trim(),show:$("#ps").checked,qr:(payCfg||{}).qr||""};
 if(f){o.qr=await qrData(f);if(o.qr.length>900000)return toast("Picture is too large, choose a smaller one")}
 try{await db.collection("settings").doc("pay").set(o);payCfg=o;try{localStorage.pdl_pay=JSON.stringify(o)}catch(e){}toast("Saved");A.pay()}catch(e){toast("Could not save: "+e.code)}}
async function clearPay(){if(!confirm("Remove the QR picture and UPI ID?"))return;try{await db.collection("settings").doc("pay").delete();payCfg={};localStorage.removeItem("pdl_pay");toast("Removed");A.pay()}catch(e){toast("Could not remove: "+e.code)}}
